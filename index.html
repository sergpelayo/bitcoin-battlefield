<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BITCOIN BATTLEFIELD // BTCUSDT</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23041a0e'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%232bff8c' font-family='monospace'%3E%E2%82%BF%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div class="overlay" aria-hidden="true"></div>

    <main id="hud">
      <!-- ============ Superior izquierda: identidad + estado ============ -->
      <section class="panel panel--tl">
        <h1 class="brand">BITCOIN<span>BATTLEFIELD</span></h1>
        <div class="brand-sub">BTC / USDT &middot; ORDER BOOK WARFARE</div>
        <div class="status" id="status">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">conectando…</span>
        </div>
      </section>

      <!-- ============ Superior centro: precio ============ -->
      <section class="panel panel--price">
        <div class="price-label">PRECIO SPOT</div>
        <div class="price" id="price">—</div>
        <div class="price-change" id="change">—</div>
      </section>

      <!-- ============ Superior derecha: estadísticas ============ -->
      <section class="panel panel--tr">
        <div class="stat"><span class="k">MÁX 24H</span><span class="v" id="high">—</span></div>
        <div class="stat"><span class="k">MÍN 24H</span><span class="v" id="low">—</span></div>
        <div class="stat"><span class="k">VOL 24H</span><span class="v" id="vol">—</span></div>
        <div class="stat"><span class="k">SPREAD</span><span class="v" id="spread">—</span></div>
        <div class="stat"><span class="k">RANGO</span><span class="v" id="range">—</span></div>
      </section>

      <!-- ============ Inferior centro: presión de mercado ============ -->
      <section class="panel panel--pressure">
        <div class="pressure-head">
          <span class="side side--bull">▲ TOROS <b id="bull-pct">50.0%</b></span>
          <span class="pressure-title">PRESIÓN DEL MERCADO</span>
          <span class="side side--bear"><b id="bear-pct">50.0%</b> OSOS ▼</span>
        </div>
        <div class="pressure-bar">
          <div class="pressure-fill" id="pressure-fill"></div>
          <div class="pressure-mid"></div>
        </div>
        <div class="pressure-foot">
          <span>BID <b id="bid-vol">—</b></span>
          <span id="verdict" class="verdict">EQUILIBRIO</span>
          <span>ASK <b id="ask-vol">—</b></span>
        </div>
      </section>

      <!-- ============ Inferior izquierda: log de combate ============ -->
      <section class="panel panel--log">
        <div class="log-title">// FLUJO DE ÓRDENES</div>
        <ul class="log" id="log"></ul>
      </section>

      <!-- ============ Inferior derecha: controles ============ -->
      <section class="panel panel--help">
        <div class="help-row"><b>ARRASTRAR</b> orbitar</div>
        <div class="help-row"><b>RUEDA</b> zoom</div>
        <div class="help-row"><b>R</b> reencuadrar</div>
        <div class="help-row"><b>B</b> bloom <span id="bloom-state">ON</span></div>
        <div class="help-row help-row--fps"><b id="fps">--</b> FPS</div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
